name: Notebooks Smoke Test

# Las demos necesitan un modelo corriendo en el equipo (Ollama u otro), así que aquí
# no se ejecutan: se comprueba que las dependencias se instalen en Python 3.10 y 3.12,
# que cada notebook tenga una estructura válida y que el código de sus celdas no tenga
# errores de sintaxis.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate notebooks and compile code cells
        run: |
          python - <<'PY'
          import ast
          import glob
          import sys

          import nbformat

          NOTEBOOKS = sorted(glob.glob("[0-9][0-9]_*.ipynb"))
          if not NOTEBOOKS:
              sys.exit("[VALIDACIÓN] No se encontraron notebooks.")

          fallas = []
          for path in NOTEBOOKS:
              nb = nbformat.read(path, as_version=4)
              nbformat.validate(nb)
              for i, cell in enumerate(nb.cells):
                  if cell.cell_type != "code":
                      continue
                  # Las líneas mágicas (%) y de shell (!) no son Python.
                  fuente = "\n".join(l for l in cell.source.splitlines() if not l.lstrip().startswith(("%", "!")))
                  try:
                      compile(fuente, f"{path}[{i}]", "exec", flags=ast.PyCF_ALLOW_TOP_LEVEL_AWAIT | ast.PyCF_ONLY_AST)
                  except SyntaxError as exc:
                      fallas.append(f"{path} celda {i}: {exc}")
              print(f"[OK] {path}")
          if fallas:
              print("\n[VALIDACIÓN] Fallaron:", *fallas, sep="\n  - ")
              sys.exit(1)
          PY
